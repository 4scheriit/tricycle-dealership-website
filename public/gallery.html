<!DOCTYPE html>

</head>
<body class="hero-page">
<header class="site-header">
    <nav class="navbar navbar--transparent">
        <div class="nav-container">
            <a href="index.html" class="logo-text">TRICYCLE</a>
            <ul class="nav-menu nav-menu--hero">
                <li><a href="products.html" class="nav-link">Shop</a></li>
                <li><a href="special-offer.html" class="nav-link">Deals</a></li>
                <li><a href="gallery.html" class="nav-link">Gallery</a></li>
                <li><a href="about.html" class="nav-link">About</a></li>

            </ul>
        </div>
    </nav>

    <section class="hero hero--video-look hero--compact">
        <div class="hero-media">
            <img src="https://images.unsplash.com/photo-1502933691298-84fc14542831?auto=format&fit=crop&w=1600&q=80"
                 alt="Tricycle closeup" class="hero-bg-image">
            <div class="hero-overlay"></div>
        </div>
        <div class="hero-inner">
            <div class="hero-copy">
                <p class="hero-kicker">Gallery</p>
                <h1 class="hero-heading">Tricycles in their natural habitat.</h1>
                <p class="hero-subtitle">
                    Real riders, real streets, real adventures powered by three wheels.
                </p>
            </div>
        </div>
    </section>
</header>

<main class="page-main">
    <section class="gallery-section container">
        <div class="gallery-grid sleek-gallery">
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1607853554439-0069ec0f29b6?auto=format&fit=crop&w=900&q=80"
                     alt="Classic red tricycle">
                <figcaption>Classic Red Sprint</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1558618666-fcd25c85cd64?auto=format&fit=crop&w=900&q=80"
                     alt="Performance tricycle">
                <figcaption>Performance Session</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1591081351635-36adde311466?auto=format&fit=crop&w=900&q=80"
                     alt="Cargo tricycle">
                <figcaption>Cargo City Runs</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1517649763962-0c623066013b?auto=format&fit=crop&w=900&q=80"
                     alt="Electric tricycle">
                <figcaption>Electric Glide</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1571333250630-f0230c320b6d?auto=format&fit=crop&w=900&q=80"
                     alt="Vintage tricycle">
                <figcaption>Vintage Lines</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1619025936712-09e21e2e48c4?auto=format&fit=crop&w=900&q=80"
                     alt="Family ride">
                <figcaption>Family Rollout</figcaption>
            </figure>

    </section>
</main>
